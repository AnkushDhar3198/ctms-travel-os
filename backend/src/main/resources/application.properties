# ========================================
# CTMS - Application Configuration
# ========================================

# Server (Supports Render dynamic $PORT)
server.port=${PORT:8080}

# ----------------------------------------
# H2 Database (File-based for persistence)
# ----------------------------------------
spring.datasource.url=jdbc:h2:file:./data/ctmsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ----------------------------------------
# JPA / Hibernate
# ----------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# Hibernate Performance: batch fetch lazy collections in groups of 20
spring.jpa.properties.hibernate.default_batch_fetch_size=20

# ----------------------------------------
# SQL Init (seed data)
# ----------------------------------------
spring.sql.init.mode=never

# ----------------------------------------
# JWT Configuration
# ----------------------------------------
jwt.secret=CTMS_S3cur3_JWT_K3y_2024_Pr0duct10n_R34dy_256B1t_Str0ng!
jwt.expiration=86400000

# ----------------------------------------
# File Upload
# ----------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----------------------------------------
# Logging
# ----------------------------------------
logging.level.com.ctms=INFO
logging.level.org.springframework.security=WARN

# ----------------------------------------
# Performance: HTTP Response Compression
# ----------------------------------------
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript
server.compression.min-response-size=1024

# ----------------------------------------
# Performance: HikariCP Connection Pool
# ----------------------------------------
spring.datasource.hikari.maximum-pool-size=15
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000

# ----------------------------------------
# Performance: Static Resource Caching
# ----------------------------------------
spring.web.resources.cache.period=31536000
spring.web.resources.cache.cachecontrol.max-age=31536000
spring.web.resources.cache.cachecontrol.cache-public=true

