# ========================================
# CTMS - Application Configuration
# ========================================

# Server
server.port=8080

# ----------------------------------------
# H2 Database (File-based for persistence)
# ----------------------------------------
spring.datasource.url=jdbc:h2:file:./data/ctmsdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=true

# ----------------------------------------
# JPA / Hibernate
# ----------------------------------------
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.defer-datasource-initialization=true

# ----------------------------------------
# SQL Init (seed data)
# ----------------------------------------
spring.sql.init.mode=never

# ----------------------------------------
# JWT Configuration
# ----------------------------------------
jwt.secret=CTMS_S3cur3_JWT_K3y_2024_Pr0duct10n_R34dy_256B1t_Str0ng!
jwt.expiration=86400000

# ----------------------------------------
# File Upload
# ----------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----------------------------------------
# Logging
# ----------------------------------------
logging.level.com.ctms=INFO
logging.level.org.springframework.security=WARN
